<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Słowianka Café, Poznań Winogrady: domowe ciasta, serniki, monoporcje, wypieki drożdżowe i torty na zamówienie.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Słowianka">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='white' stroke='black' stroke-width='3'/%3E%3Ctext x='32' y='41' font-family='Georgia,serif' font-style='italic' font-size='24' text-anchor='middle'%3ESC%3C/text%3E%3C/svg%3E">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Słowianka Café</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#F1EFEA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: app shell like a pastry-shop counter — wavy hand-drawn frames (from the café's own price boards), ink-black type, coral prices. One screen at a time, bottom tab bar, cart badge. */
:root{
  --bg:#F1EFEA; --surface:#FBFAF7; --ink:#1A1918; --muted:#6D6963; --line:#DEDAD2;
  --coral:#D9534A; --coral-soft:#F7E1DD; --sage:#7E9A7C; --sage-soft:#E2EADF; --cream:#F6EBD9;
  --ok:#3E7D58; --warn:#B4600F; --on-ink:#FBFAF7;
  --f-hand:"Caveat Brush","Comic Sans MS",cursive;
  --f-logo:"Cormorant Garamond",Georgia,serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --shadow:0 1px 2px rgba(26,25,24,.05),0 8px 24px rgba(26,25,24,.06);
  --tabh:64px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#151413; --surface:#1E1D1B; --ink:#EFECE6; --muted:#A8A39B; --line:#33312D;
  --coral:#F0786E; --coral-soft:#3A2220; --sage:#9DB89A; --sage-soft:#212C20; --cream:#2E281F;
  --ok:#7FC79B; --warn:#F2A85B; --on-ink:#151413; --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151413; --surface:#1E1D1B; --ink:#EFECE6; --muted:#A8A39B; --line:#33312D;
  --coral:#F0786E; --coral-soft:#3A2220; --sage:#9DB89A; --sage-soft:#212C20; --cream:#2E281F;
  --ok:#7FC79B; --warn:#F2A85B; --on-ink:#151413; --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3{margin:0;line-height:1.1;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px;border-radius:8px}
.hand{font-family:var(--f-hand);font-weight:400;letter-spacing:.01em}

/* shell */
.app{min-height:100%;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topin{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font-family:var(--f-logo);font-style:italic;font-size:19px;flex:none;position:relative}
.mono::after{content:"";position:absolute;inset:4px;border-radius:50%;border:1px solid var(--line)}
.brand b{display:block;font-family:var(--f-logo);font-weight:500;font-size:22px;line-height:1}
.brand small{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.cartbtn{margin-left:auto;position:relative;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.cartbtn svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dot{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:999px;background:var(--coral);color:#fff;font-size:11.5px;font-weight:800;display:grid;place-items:center;padding:0 5px;font-variant-numeric:tabular-nums}

main{flex:1;width:100%;max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(var(--tabh) + 28px + env(safe-area-inset-bottom,0px))}
.screen{display:grid;gap:18px;animation:in .25s ease}
@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
.stitle h1{font-family:var(--f-hand);font-weight:400;font-size:44px;line-height:1}
.sub{color:var(--muted);font-size:15px}
.label{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar nav{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tabh)}
.tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:700;position:relative}
.tabbar svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabbar a[aria-current="page"]{color:var(--ink)}
.tabbar a[aria-current="page"]::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--coral)}
.tabbar .dot{top:6px;right:calc(50% - 22px)}
@media (min-width:980px){
  .app{padding-left:96px}
  .tabbar{top:0;right:auto;width:96px;border-top:0;border-right:1px solid var(--line);padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
  .tabbar nav{grid-template-columns:1fr;grid-auto-rows:76px;height:auto}
  .tabbar a[aria-current="page"]::before{top:auto;left:0;width:3px;height:36px;border-radius:0 3px 3px 0}
  main{padding-bottom:40px}
}

/* wavy frame */
.wavy{position:relative;padding:30px 26px;isolation:isolate}
.wavy>svg.frame{position:absolute;inset:0;width:100%;height:100%;z-index:-1;overflow:visible}
.wavy>svg.frame path{fill:var(--surface);stroke:var(--ink);stroke-width:3.5;vector-effect:non-scaling-stroke}

.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow);min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:13px 20px;font-weight:800;font-size:15px;cursor:pointer;text-decoration:none;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--ink);color:var(--on-ink)}
.btn.cor{background:var(--coral);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--ink);color:var(--ink)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.chip{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.price{color:var(--coral);font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}

/* start */
.hero{display:grid;gap:12px;text-align:center;justify-items:center}
.hero .tag{font-size:11.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--muted);font-weight:700}
.hero h2{font-family:var(--f-hand);font-weight:400;font-size:clamp(38px,9vw,54px);line-height:1.02;max-width:12ch}
.hero p{max-width:34ch;color:var(--muted)}
.hours{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.hours span{font-size:13px;font-weight:700;background:var(--bg);border-radius:999px;padding:4px 10px;font-variant-numeric:tabular-nums}
.open{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:13.5px}
.open i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.open.off i{background:var(--warn)}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cat{border:0;border-radius:18px;padding:14px 10px;display:grid;gap:2px;text-align:left;cursor:pointer;color:var(--ink);min-height:92px;align-content:end}
.cat b{font-family:var(--f-hand);font-weight:400;font-size:24px;line-height:1}
.cat span{font-size:12px;color:var(--muted);font-weight:600}
.rules{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.rules li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;font-size:15px}
.rules li i{width:28px;height:28px;border-radius:50%;background:var(--coral-soft);color:var(--coral);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:14px}
.feature{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:var(--cream);border-radius:20px;padding:18px}
.feature b{font-family:var(--f-hand);font-weight:400;font-size:28px;line-height:1}

/* catalog */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 12px}
.search svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;flex:none}
.search input{border:0;background:transparent;padding:12px 0;width:100%;font:16px var(--f-body);color:var(--ink);outline:none}
.group h2{font-family:var(--f-hand);font-weight:400;font-size:34px;margin-bottom:4px}
.group .note{font-size:13px;color:var(--muted);margin-bottom:6px}
.prod{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px 0;border-bottom:1px dashed var(--line);align-items:start}
.prod:last-child{border-bottom:0}
.prod b{font-size:16px;font-weight:700}
.prod p{font-size:14px;color:var(--muted);grid-column:1}
.prod .tags{display:flex;gap:6px;flex-wrap:wrap;grid-column:1}
.t{font-size:11px;font-weight:800;padding:2px 8px;border-radius:6px;background:var(--sage-soft);color:var(--ink)}
.t.c{background:var(--coral-soft)}
.prod .right{grid-row:1/span 3;grid-column:2;display:grid;justify-items:end;gap:8px}
.add{width:38px;height:38px;border-radius:50%;border:0;background:var(--ink);color:var(--on-ink);font-size:22px;font-weight:700;cursor:pointer;display:grid;place-items:center;line-height:1}
.add.in{background:var(--coral);color:#fff;font-size:14px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:24px 24px 0 0;padding:10px max(18px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px));max-width:640px;margin:0 auto;transform:translateY(105%);visibility:hidden;transition:transform .25s ease,visibility .25s;display:grid;gap:14px;max-height:88vh;overflow:auto}
.sheet.show{transform:none;visibility:visible}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);justify-self:center}
.sheet h3{font-family:var(--f-hand);font-weight:400;font-size:32px}
.opts{display:grid;gap:8px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;background:var(--bg);font-weight:700;text-align:left}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--surface)}
.opt small{display:block;color:var(--muted);font-weight:600;font-size:12.5px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-size:18px;font-weight:800;cursor:pointer}
.stepper output{min-width:24px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}

/* cart */
.line{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line small{color:var(--muted);font-size:13px}
.line .stepper{grid-column:1}
.line .price{align-self:start}
.totals{display:grid;gap:6px;font-variant-numeric:tabular-nums}
.totals div{display:flex;justify-content:space-between;gap:10px}
.totals .big{font-size:20px;font-weight:800;padding-top:6px;border-top:1px solid var(--line)}
form{display:grid;gap:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f{display:grid;gap:6px;min-width:0}
label{font-weight:800;font-size:13.5px}
input,select,textarea{font:16px var(--f-body);padding:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);width:100%;min-width:0}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--ink);outline:none}
.hint{font-size:12.5px;color:var(--muted)}
.err{color:var(--warn);font-weight:800;font-size:14px}
.empty{text-align:center;display:grid;gap:10px;justify-items:center;padding:30px 10px}
.empty b{font-family:var(--f-hand);font-weight:400;font-size:32px}
.ok{display:grid;gap:10px;text-align:center;justify-items:center}
.ok b.hand{font-size:40px;line-height:1}

/* cakes */
.occ{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.oc{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 6px;font-weight:700;font-size:13px;cursor:pointer;text-align:center}
.oc[aria-pressed="true"]{border-color:var(--ink);background:var(--cream)}
.flav{display:flex;flex-wrap:wrap;gap:8px}

/* info */
.li{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.li:last-child{border-bottom:0}
.li i{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--bg)}
.li svg{width:20px;height:20px;fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.li b{display:block;font-size:15px}
.li small{color:var(--muted);font-size:13px}
.htab{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-variant-numeric:tabular-nums}
.htab .today{font-weight:800}
.mine{display:grid;gap:10px}
.pill{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--cream);margin-left:6px}
.arow{display:grid;gap:6px;padding:12px 0;border-bottom:1px solid var(--line)}
.arow:last-child{border-bottom:0}
.arow .h{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.arow select{width:auto;padding:6px 10px;font-size:14px}
.arow small{color:var(--muted);overflow-wrap:anywhere}
.demo{font-size:13px;color:var(--muted);border:1px dashed var(--line);border-radius:12px;padding:8px 12px;background:var(--surface)}

.toast{position:fixed;left:50%;bottom:calc(var(--tabh) + 16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--on-ink);padding:12px 18px;border-radius:14px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:400px){.cats{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}.occ{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="topin">
      <div class="mono" aria-hidden="true">S&amp;C</div>
      <div class="brand"><b>Słowianka</b><small>café · Winogrady</small></div>
      <button class="cartbtn" id="topCart" aria-label="Koszyk"><svg viewBox="0 0 24 24"><path d="M5 8h14l-1.2 11a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><span class="dot" id="topDot" hidden>0</span></button>
    </div>
  </header>
  <main id="view"></main>
  <div class="tabbar"><nav aria-label="Nawigacja" id="tabs"></nav></div>
</div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle"></div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
const $=s=>document.querySelector(s);
const DEMO=!(window.claude&&window.claude.use);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(_){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(_){}}};
const zl=n=>Number.isInteger(n)?n+" zł":n.toFixed(2).replace(".",",")+" zł";

/* ---------- data (z cennika Słowianki) ---------- */
const FB="https://www.facebook.com/search/top?q=S%C5%82owianka%20caf%C3%A9", IG="https://www.instagram.com/slowianka.cafe/";
const HOURS=[null,[10,17],[10,17],[10,17],[10,17],[9.5,16],[10,16]]; // index = (day+6)%7 → Pn..Nd ; Pn zamknięte
const DAYN=["Poniedziałek","Wtorek","Środa","Czwartek","Piątek","Sobota","Niedziela"];
const hh=x=>`${Math.floor(x)}:${x%1?"30":"00"}`;
const SER=[{l:"18 cm",s:"10 porcji",p:144},{l:"21 cm",s:"12 porcji",p:180},{l:"24 cm",s:"14 porcji",p:216}];
const SERP=[{l:"18 cm",s:"10 porcji",p:160},{l:"21 cm",s:"12 porcji",p:200},{l:"24 cm",s:"14 porcji",p:240}];
const one=(p,l="21 cm")=>[{l,s:"",p}];
const CATS=[
 {id:"serniki",n:"Serniki",lead:3,note:"Możliwa wersja bezglutenowa. Serniki sezonowe: zapytaj.",bg:"var(--cream)",items:[
  ["Sernik waniliowy z owocami i białą czekoladą","Owoc do wyboru: malina, jagoda, porzeczka",SER,[],["malina","jagoda","porzeczka"]],
  ["Sernik pomarańczowy","",SER],["Sernik Oreo","",SER],["Sernik kajmakowy","",SER],["Sernik z Milky Way","",SER],["Sernik z krówkami","",SER],
  ["Sernik chałwowy z malinami","",SER],["Sernik Nutella z malinami","",SER],["Sernik jogurtowy z konfiturą owocową","",SER],
  ["Sernik z musem z mlecznej czekolady","",SER],["Sernik z musem karmelowym","",SER],["Sernik z musem owocowym","Owoc zależy od sezonu",SER],
  ["Sernik z musem pistacjowym","",SER],["Sernik pistacjowy","",SERP,["Polecamy"]]]},
 {id:"ciasta",n:"Ciasta i bezy",lead:3,note:"",bg:"var(--coral-soft)",items:[
  ["Ciasto marchewkowe z kremem śmietankowym","",one(150)],["Ciasto orzechowe","",one(150)],["Szarlotka","",one(90)],
  ["Ciasto bananowe z białą czekoladą","",one(80)],["Ciasto Bounty","",one(130)],["Ciasto czekoladowe","",one(80)],

function wavyPath(){let d="";const n=9,a=1.4;const pts=[];
  const edge=(x0,y0,x1,y1,nx,ny)=>{for(let i=0;i<=n*16;i++){const t=i/(n*16);const w=Math.sin(t*n*2*Math.PI)*a;pts.push([x0+(x1-x0)*t+nx*w,y0+(y1-y0)*t+ny*w])}};
  edge(4,4,96,4,0,1);edge(96,4,96,96,1,0);edge(96,96,4,96,0,1);edge(4,96,4,4,1,0);
  pts.forEach((p,i)=>d+=(i?"L":"M")+p[0].toFixed(2)+" "+p[1].toFixed(2));return d+"Z"}
const WAVY=`<svg class="frame" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path d="${wavyPath()}"/></svg>`;

     <div class="f"><label for="t_img">Zdjęcie inspiracji (opcjonalnie)</label><input id="t_img" name="img" type="file" accept="image/*"></div>
     <div class="row"><div class="f"><label for="t_name">Imię i nazwisko</label><input id="t_name" name="name" autocomplete="name" value="${esc(pr.name||"")}"></div>
     <div class="f"><label for="t_phone">Telefon</label><input id="t_phone" name="phone" type="tel" autocomplete="tel" placeholder="600 123 456" value="${esc(pr.phone||"")}"></div></div>
     <p class="err" id="err" hidden></p>
     <button class="btn cor block" type="submit">Wyślij zapytanie o tort</button>
   </form></section>`;
}

function Done(){const r=st.done;
  return `<section class="screen"><div class="wavy">${WAVY}<div class="ok">
   <b class="hand">Dziękujemy!</b>
   <p><b>${r.kind==="tort"?"Zapytanie o tort":"Zamówienie"}</b> na ${esc(fmtDay(r.date))}${r.time?", "+esc(r.time):""}</p>
   <p class="sub">${esc(r.summary)}</p>
   <p class="sub">${DEMO&&!r._saved?"To wersja demonstracyjna. W gotowej stronie zamówienie trafi do panelu kawiarni.":r._saved?`Zadzwonimy na ${esc(r.phone)}, żeby potwierdzić${r.kind==="tort"?" i podać wycenę":" i ustalić wpłatę 50%"}.`:"Nie udało się wysłać online. Napisz do nas na Instagramie lub Facebooku."}</p>
   <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button class="btn ghost" data-go="info">Moje zamówienia</button><button class="btn pri" data-go="oferta">Wróć do oferty</button></div>
  </div></div></section>`;}

function Info(){
  const mine=store.get("sc_mine",[]);const today=(new Date().getDay()+6)%7;
  return `<section class="screen"><div class="stitle"><h1>Info</h1></div>
   <div class="card"><p class="label" style="margin-bottom:10px">Moje zamówienia</p>
    ${mine.length?`<div class="mine">${mine.slice(0,6).map(r=>`<div><b>${r.kind==="tort"?"Tort":"Zamówienie"}</b> · ${esc(fmtDay(r.date))}<span class="pill">wysłane</span><br><small class="sub">${esc(r.summary)}</small></div>`).join("")}</div>`:`<p class="sub">Tu zobaczysz zamówienia wysłane z tego urządzenia.</p>`}
   </div>
   <div class="card"><p class="label" style="margin-bottom:10px">Godziny otwarcia</p><div class="htab">${DAYN.map((d,i)=>`<span class="${i===today?"today":""}">${d}</span><span class="${i===today?"today":""}">${HOURS[i]?hh(HOURS[i][0])+"–"+hh(HOURS[i][1]):"nieczynne"}</span>`).join("")}</div></div>
   <div class="card">
    <div class="li"><i>${svg("pin")}</i><div><b>Słowianka Café</b><small>Poznań, Winogrady</small></div><span></span></div>
    <a class="li" href="${IG}" target="_blank" rel="noopener"><i>${svg("cam")}</i><div><b>Instagram @slowianka.cafe</b><small>Nowości, weekendy cynamonkowe, torty</small></div><span>›</span></a>
    <a class="li" href="${FB}" target="_blank" rel="noopener"><i>${svg("chat")}</i><div><b>Facebook Słowianka café</b><small>Wiadomości i zamówienia</small></div><span>›</span></a>
   </div>
   <div class="card" id="admin" hidden><p class="label">Panel kawiarni · zamówienia</p><div class="chips" style="margin:10px 0" id="afilter"></div><div id="alist"></div></div>
  </section>`;
}

function render(){drawTabs();$("#view").innerHTML={start:Start,oferta:Oferta,torty:Torty,koszyk:Koszyk,info:Info}[route]();fillTimes();if(route==="info"&&isAdmin)drawAdmin()}

$("#view").addEventListener("click",e=>{const t=e.target;
  const c=t.closest("[data-c]");if(c){st.cat=c.dataset.c;render();return}
  const a=t.closest("[data-add]");if(a){openSheet(a.dataset.add);return}
  const cq=t.closest("[data-cq]");if(cq){const l=cart[+cq.dataset.i];const n=l.qty+(+cq.dataset.cq);if(n<l.min){cart.splice(+cq.dataset.i,1);toast("Usunięto z koszyka")}else l.qty=Math.min(50,n);saveCart();render();return}
  const oc=t.closest("[data-occ]");if(oc){st.occ=oc.dataset.occ;document.querySelectorAll("[data-occ]").forEach(b=>b.setAttribute("aria-pressed",b===oc));return}
  const fl=t.closest("[data-flav]");if(fl){const v=fl.dataset.flav;st.flav=st.flav.includes(v)?st.flav.filter(x=>x!==v):[...st.flav,v];fl.setAttribute("aria-pressed",st.flav.includes(v));return}
});
$("#view").addEventListener("input",e=>{if(e.target.id==="q"){st.q=e.target.value;const pos=e.target.selectionStart;render();const q=$("#q");q.focus();try{q.setSelectionRange(pos,pos)}catch(_){}}});
$("#view").addEventListener("change",e=>{if(e.target.id==="o_date")fillTimes()});

/* ---------- submit ---------- */
function check(fd,err){
  if(!(fd.name||"").trim())return "Wpisz imię i nazwisko.";
  if((fd.phone||"").replace(/\D/g,"").length<9)return "Wpisz numer telefonu (9 cyfr), żebyśmy mogli potwierdzić zamówienie.";
  if(!fd.date)return "Wybierz datę odbioru.";
  if(!HOURS[(new Date(fd.date+"T12:00").getDay()+6)%7])return "W poniedziałki kawiarnia jest nieczynna. Wybierz inny dzień.";
  return "";
}
async function send(rec,form){
  const b=form.querySelector("button[type=submit]");b.disabled=true;b.textContent="Wysyłanie…";
  await ready;let saved=false;if(DEMO)await new Promise(r=>setTimeout(r,600));
  if(db){try{await db.collection("orders").add(rec);saved=true}catch(_){}}
  const mine=store.get("sc_mine",[]);mine.unshift(rec);store.set("sc_mine",mine.slice(0,20));
  store.set("sc_contact",{name:rec.name,phone:rec.phone});
  st.done={...rec,_saved:saved};
}
$("#view").addEventListener("submit",async e=>{
  e.preventDefault();const f=e.target;const fd=Object.fromEntries(new FormData(f).entries());const err=$("#err");
  if(f.id==="oform"){
    const m=check(fd);if(m){err.textContent=m;err.hidden=false;return}
    if(fd.date<f.date.min){err.textContent="Ta data jest za wcześnie dla wybranych wypieków.";err.hidden=false;return}
    const tot=cartTotal();
    const rec={kind:"zamowienie",name:fd.name,phone:fd.phone,date:fd.date,time:fd.time,note:fd.note||"",items:cart.map(l=>({n:l.n,v:l.v,qty:l.qty,p:l.p})),total:tot,deposit:tot/2,
      summary:cart.map(l=>`${l.n}${l.v&&l.v!=="1 szt."&&l.v!=="1 porcja"?" ("+l.v+")":""} ×${l.qty}`).join(", ")+` · ${zl(tot)}`,status:"nowe",createdAt:new Date().toISOString()};
    await send(rec,f);cart=[];saveCart();render();window.scrollTo(0,0);toast("Zamówienie wysłane");
  } else if(f.id==="tform"){
    const m=check(fd);if(m){err.textContent=m;err.hidden=false;return}
    const img=f.img.files[0]?f.img.files[0].name:"";
    const rec={kind:"tort",name:fd.name,phone:fd.phone,date:fd.date,time:"",occasion:st.occ,portions:fd.portions,flavours:st.flav,theme:fd.theme||"",text:fd.text||"",image:img,
      summary:`${st.occ} · ${fd.portions} porcji${st.flav.length?" · "+st.flav.join(", "):""}${fd.theme?" · "+fd.theme:""}`,status:"nowe",createdAt:new Date().toISOString()};
    await send(rec,f);st.flav=[];render();window.scrollTo(0,0);toast("Zapytanie wysłane");
  }
});

/* ---------- owner panel ---------- */
let db=null,isAdmin=false,all=[],flt="nowe";
const ready=(async()=>{try{if(DEMO)return;const[d,u]=await Promise.all([claude.use("db"),claude.use("user")]);db=d;
  if(db&&u&&await u.canEdit()){isAdmin=true;db.collection("orders").orderBy("createdAt","desc").limit(300).onSnapshot(s=>{all=s.docs.map(x=>({id:x.id,...x.data()}));if(route==="info")drawAdmin()},()=>{});if(route==="info")drawAdmin()}}catch(_){}})();
function drawAdmin(){const box=$("#admin");if(!box)return;box.hidden=false;
  const F=[["nowe","Nowe"],["potwierdzone","Potwierdzone"],["gotowe","Gotowe"],["all","Wszystkie"]];
  $("#afilter").innerHTML=F.map(([k,n])=>`<button class="chip" aria-pressed="${k===flt}" data-flt="${k}">${n} ${k==="all"?all.length:all.filter(r=>r.status===k).length}</button>`).join("");
  const rows=all.filter(r=>flt==="all"||r.status===flt).sort((a,b)=>a.date<b.date?-1:1);
  $("#alist").innerHTML=rows.length?rows.map(r=>`<div class="arow"><div class="h"><b>${r.kind==="tort"?"Tort":"Zamówienie"} · ${esc(r.date)} ${esc(r.time||"")}</b><select data-id="${esc(r.id)}" aria-label="Status">${["nowe","potwierdzone","gotowe","odebrane","anulowane"].map(x=>`<option ${x===r.status?"selected":""}>${x}</option>`).join("")}</select></div>
   <div>${esc(r.name)} · <span style="user-select:all">${esc(r.phone)}</span>${r.deposit?` · wpłata ${zl(r.deposit)}`:""}</div><small>${esc(r.summary)}${r.text?" · napis: „"+esc(r.text)+"”":""}${r.note?" · "+esc(r.note):""}</small></div>`).join("")
   :`<p class="sub">Brak zamówień w tym widoku. Nowe pojawią się tu same.</p>`}
document.addEventListener("click",e=>{const b=e.target.closest("[data-flt]");if(b){flt=b.dataset.flt;drawAdmin()}});
document.addEventListener("change",async e=>{const s=e.target.closest("select[data-id]");if(!s||!db)return;try{await db.collection("orders").doc(s.dataset.id).update({status:s.value});toast("Status: "+s.value)}catch(_){toast("Nie udało się zmienić statusu")}});

const h=(location.hash||"").slice(1);if(TABS.some(t=>t[0]===h))route=h;
render();
})();
</script>
</body>
</html>
